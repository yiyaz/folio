name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: folio, POSTGRES_PASSWORD: folio, POSTGRES_DB: folio }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U folio" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://folio:folio@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # coverage thresholds are enforced; S3 tests start adobe/s3mock via Testcontainers
      - run: pnpm test:coverage
      - run: pnpm --filter @folio/web --filter @folio/cli test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: folio, POSTGRES_PASSWORD: folio, POSTGRES_DB: folio }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U folio" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { E2E_DATABASE_URL: 'postgres://folio:folio@localhost:5432/folio_e2e' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: 'playwright-report/' }

  image:
    name: Container image & Helm chart
    runs-on: ubuntu-latest
    needs: [check]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/folio --set secrets.databaseUrl=postgres://u:p@db/folio
      - run: helm template t deploy/helm/folio --set postgresql.enabled=true --set storage.driver=fs --set replicaCount=1 --set autoscaling.enabled=false > /dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

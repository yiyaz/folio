{{- if .Values.minio.enabled }}
{{- $name := printf "%s-minio" (include "folio.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "folio.labels" . | nindent 4 }}
type: Opaque
stringData:
  rootPassword: {{ include "folio.minioPassword" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "folio.labels" . | nindent 4 }}
spec:
  ports: [{ port: 9000, targetPort: 9000, name: s3 }]
  selector: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "folio.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: [server, /data]
          ports: [{ containerPort: 9000, name: s3 }]
          env:
            - { name: MINIO_ROOT_USER, value: {{ .Values.minio.rootUser | quote }} }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: rootPassword } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 256Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.minio.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.minio.storage }} } }
{{- end }}

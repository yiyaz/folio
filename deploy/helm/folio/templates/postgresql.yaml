{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "folio.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "folio.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "folio.pgPassword" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "folio.labels" . | nindent 4 }}
spec:
  ports: [{ port: 5432, targetPort: 5432, name: postgres }]
  selector: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "folio.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { fsGroup: 70, runAsUser: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}] }
            periodSeconds: 5
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 256Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.storage }} } }
{{- end }}

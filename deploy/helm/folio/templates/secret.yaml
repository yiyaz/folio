{{- if not .Values.existingSecret }}
{{- $fullname := include "folio.fullname" . -}}
{{- $appSecret := .Values.secrets.appSecret | default (include "folio.generated" (dict "ctx" . "secret" (printf "%s-secrets" $fullname) "key" "APP_SECRET")) -}}
{{- $dbUrl := .Values.secrets.databaseUrl -}}
{{- if .Values.postgresql.enabled -}}
{{- $dbUrl = printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username (include "folio.pgPassword" .) $fullname .Values.postgresql.database -}}
{{- end -}}
{{- if not $dbUrl }}{{ fail "Set secrets.databaseUrl, postgresql.enabled=true, or existingSecret" }}{{ end -}}
{{- $s3Key := .Values.secrets.s3AccessKeyId -}}
{{- $s3Secret := .Values.secrets.s3SecretAccessKey -}}
{{- if .Values.minio.enabled -}}
{{- $s3Key = .Values.minio.rootUser -}}
{{- $s3Secret = include "folio.minioPassword" . -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secrets
  labels: {{- include "folio.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET: {{ $appSecret | quote }}
  DATABASE_URL: {{ $dbUrl | quote }}
  S3_ACCESS_KEY_ID: {{ $s3Key | quote }}
  S3_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  MAIL_TRANSPORT: {{ .Values.secrets.mailTransport | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  JIRA_EMAIL: {{ .Values.secrets.jiraEmail | quote }}
  JIRA_TOKEN: {{ .Values.secrets.jiraToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}

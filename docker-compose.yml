# Local development / single-host deployment.
#   docker compose up -d                          # Postgres, Mailpit and Folio on http://localhost:3000
#   docker compose up -d db mailpit && pnpm dev   # only the dependencies; run the app from source
#
# Documents are stored on a Docker volume (STORAGE_DRIVER=fs). Their readable copy is in the
# volume's library/ folder, e.g.:  docker compose cp app:/data/storage/library ./folio-library
# For S3-compatible storage (AWS S3, Cloudflare R2, ...), see docs/configuration.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U folio']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025'] # web UI on http://localhost:8025 shows sign-up and notification e-mails

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: folio:local
    depends_on:
      db: { condition: service_healthy }
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://folio:folio@db:5432/folio
      APP_SECRET: change-me-to-a-long-random-string-please
      PUBLIC_URL: http://localhost:3000
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/storage
      MAIL_TRANSPORT: smtp://mailpit:1025
      REQUIRE_EMAIL_VERIFICATION: 'true'
      # optional: enable AI writing
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [folio-data:/data]

volumes:
  pgdata:
  folio-data:
